  <style>
    /* Inter: variable font; same file referenced across all weights, browser uses the wght axis. */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(fonts/inter-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(fonts/inter-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* Newsreader italic 400 — used only for emphasis in headings. */
    @font-face {
      font-family: 'Newsreader';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/newsreader-italic-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: url(fonts/newsreader-italic-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #faf7f2;
      --bg-2:      #f3eee5;
      --ink:       #1a1d1a;
      --ink-soft:  #4a4d4a;
      --muted:     #767972;
      --accent:    #4a6c5b;
      --accent-2:  #5d8071;
      --accent-bg: #eef2ed;
      --card:      #ffffff;
      --border:    #e4dfd4;

      --s-1: 0.5rem; --s-2: 1rem; --s-3: 1.5rem; --s-4: 2rem;
      --s-5: 3rem;   --s-6: 4rem; --s-7: 6rem;

      --radius: 14px;
      --radius-sm: 8px;
      --max-w: 1140px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    h1, h2, h3 { color: var(--ink); line-height: 1.15; letter-spacing: -0.015em; font-weight: 600; }
    h1 { font-size: clamp(2.5rem, 5.5vw, 4.5rem); font-weight: 600; letter-spacing: -0.025em; }
    h2 { font-size: clamp(1.8rem, 3.6vw, 2.6rem); font-weight: 600; }
    h3 { font-size: 1.25rem; font-weight: 600; }

    h1 em, h2 em {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: var(--accent);
    }

    p { color: var(--ink-soft); }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }

    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 1.5rem; }
    @media (min-width: 768px) { .container { padding: 0 2rem; } }

    .section { padding: var(--s-7) 0; }

    .section-label {
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent);
      margin-bottom: var(--s-2);
    }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 0.5rem; padding: 0.95rem 1.5rem;
      background: var(--ink); color: var(--bg);
      border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 1rem; font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-primary:hover { background: #000; color: var(--bg); transform: translateY(-1px); }

    .btn-ghost {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.95rem 0.5rem;
      color: var(--ink); font-weight: 500; font-size: 1rem;
    }
    .btn-ghost:hover { color: var(--accent); }

    .reveal { opacity: 0; transform: translateY(12px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
    .reveal-delay-1 { transition-delay: 0.08s; }
    .reveal-delay-2 { transition-delay: 0.16s; }
    .reveal-delay-3 { transition-delay: 0.24s; }
    .reveal-delay-4 { transition-delay: 0.32s; }

    /* Section-specific styles are appended below this line. */

<!-- Sections appended by subsequent tasks. -->

<script>
  /* Configuration. Founder replaces these with real values before launch. */
  var BOOKING_URL = 'https://cal.com/agentheaven/30min';
  var META_PIXEL_ID = '';

  /* Translations: sections 2–11 each add their keys to T.en, T.hu, T.de.
     All values are plain text — applyTranslations uses textContent only. */
  var T = { en: {}, hu: {}, de: {} };

  var currentLang = localStorage.getItem('ah_lang') || (navigator.language && navigator.language.slice(0,2)) || 'en';
  if (!T[currentLang]) currentLang = 'en';

  function t(key) {
    return (T[currentLang] && T[currentLang][key]) || (T.en && T.en[key]) || '';
  }

  function applyTranslations() {
    document.documentElement.lang = currentLang;
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      var val = t(key);
      if (val) el.textContent = val;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-placeholder');
      var val = t(key);
      if (val) el.setAttribute('placeholder', val);
    });
    document.querySelectorAll('[data-i18n-aria-label]').forEach(function(el) {
      var key = el.getAttribute('data-i18n-aria-label');
      var val = t(key);
      if (val) el.setAttribute('aria-label', val);
    });
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-lang') === currentLang);
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    applyTranslations();
  });
</script>
