<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal; font-weight: 400 800;
      src: url(fonts/inter-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Newsreader';
      font-style: italic; font-weight: 400;
      src: url(fonts/newsreader-italic-latin.woff2) format('woff2');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* Quick Look renders HTML thumbnails on a 1024px canvas, then scales to 1200px. */
      width: 1024px; height: 538px;
      background: #07091a;
      font-family: 'Inter', sans-serif;
      color: #f0f3ff;
      padding: 60px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Aurora gradient orbs */
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px); mix-blend-mode: screen;
    }
    .orb-1 { width: 500px; height: 500px; top: -160px; left: -100px;  background: radial-gradient(circle, #00e0ff 0%, transparent 70%); opacity: 0.55; }
    .orb-2 { width: 460px; height: 460px; top: -120px; right: -120px; background: radial-gradient(circle, #f72585 0%, transparent 70%); opacity: 0.55; }
    .orb-3 { width: 420px; height: 420px; bottom: -180px; left: 35%;  background: radial-gradient(circle, #a78bfa 0%, transparent 70%); opacity: 0.5;  }

    /* Subtle grid overlay */
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(ellipse 100% 80% at 50% 40%, #000 30%, transparent 80%);
              mask-image: radial-gradient(ellipse 100% 80% at 50% 40%, #000 30%, transparent 80%);
    }

    .row { position: relative; z-index: 2; }

    /* Header row */
    .logo {
      display: inline-flex; align-items: center; gap: 12px;
      font-weight: 800; font-size: 24px; letter-spacing: -0.02em;
    }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: linear-gradient(135deg, #00e0ff 0%, #a78bfa 100%);
      box-shadow: 0 0 0 4px rgba(0,224,255,0.18), 0 0 22px rgba(0,224,255,0.65);
    }

    /* Headline */
    .headline {
      font-size: 72px; font-weight: 800; line-height: 1.0; letter-spacing: -0.035em;
      max-width: 15ch;
    }
    .headline em {
      font-family: 'Newsreader', Georgia, serif;
      font-style: italic; font-weight: 400;
      background: linear-gradient(135deg, #00e0ff 0%, #a78bfa 45%, #f72585 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      letter-spacing: -0.04em;
    }

    /* Foot row */
    .foot {
      display: flex; align-items: center; justify-content: space-between;
      gap: 32px;
    }
    .tagline {
      font-size: 19px; color: #b8bdda; font-weight: 500;
      max-width: 900px; line-height: 1.4;
    }
    .pill {
      display: none;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(0,224,255,0.08);
      border: 1.5px solid rgba(0,224,255,0.45);
      color: #00e0ff;
      font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
      white-space: nowrap;
      box-shadow: 0 0 30px rgba(0,224,255,0.18);
    }
  </style>
</head>
<body>
  <span class="orb orb-1"></span>
  <span class="orb orb-2"></span>
  <span class="orb orb-3"></span>
  <div class="grid"></div>

  <div class="row logo"><span class="dot"></span>AgentHeaven</div>

  <h1 class="row headline">Never let a good customer <em>go unanswered.</em></h1>

  <div class="row foot">
    <span class="tagline">AI receptionist + digital employees for SMBs. One flat monthly fee.</span>
    <span class="pill">agentheaven.ai</span>
  </div>
</body>
</html>
