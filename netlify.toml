# Netlify config for agentheaven.ai (static site, no framework).

[build]
  publish = "."
  # Regenerates hu/index.html and de/index.html from index.html so the translated pages never go stale.
  # Needs python3 and node (both are on the Netlify build image). The generated files are committed too.
  command = "python3 scripts/build-i18n.py"

# --- URLs: one address per page ------------------------------------------------------------------
# /index.html duplicates / (and the language pages) and would split ranking; the canonicals point at the short form.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/hu/index.html"
  to = "/hu/"
  status = 301
  force = true
[[redirects]]
  from = "/de/index.html"
  to = "/de/"
  status = 301
  force = true
[[redirects]]
  from = "https://www.agentheaven.ai/*"
  to = "https://agentheaven.ai/:splat"
  status = 301
  force = true

# --- Not for the public ----------------------------------------------------------------------------
# Netlify publishes the whole folder; robots.txt only asks crawlers nicely. These return 404.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/og-image.html"
  to = "/404.html"
  status = 404
  force = true

# --- Headers ---------------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Same URL, may be replaced: keep these short-lived.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Thank-you page is for conversions only.
[[headers]]
  for = "/thank-you.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
